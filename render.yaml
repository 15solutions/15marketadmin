services:
  # Backend Service
  - type: web
    name: 15market-backend
    env: node
    rootDir: nexus-core
    buildCommand: npm install --legacy-peer-deps
    startCommand: node src/index.js
    envVars:
      - key: PORT
        value: 3010
      - key: NODE_ENV
        value: production
      # These should be set in the Render Dashboard for security, but listed here for clarity
      - fromContext: env
        key: PRIVATE_KEY
      - fromContext: env
        key: ARC_CONTRACT_ADDRESS
      - fromContext: env
        key: REDIS_URL
      - fromContext: env
        key: SUPABASE_URL
      - fromContext: env
        key: SUPABASE_SERVICE_ROLE_KEY
      - fromContext: env
        key: ROUNDS_CONTRACT_ADDRESS
      - fromContext: env
        key: ADMIN_TOKEN
      - key: ALLOWED_ORIGINS
        value: "https://15market.online,https://api.15market.online"

  # Frontend Service (Static Site)
  - type: static
    name: 15market-frontend
    env: static
    rootDir: 15market
    buildCommand: npm install --legacy-peer-deps && npm run build
    publishDir: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_KEEPER_URL
        value: https://api.15market.online
      - key: VITE_KEEPER_URL_ARC
        value: https://api.15market.online
      - key: VITE_TURNKEY_ORGANIZATION_ID
        value: 29276b8b-8776-4c78-8c2e-c63cc6dde605
      - key: VITE_TURNKEY_AUTH_PROXY_CONFIG_ID
        value: 562519f9-2589-45e7-be1f-5fc06da1d19b
      - key: VITE_TURNKEY_API_BASE_URL
        value: https://api.turnkey.com
      - key: VITE_TURNKEY_RP_ID
        value: 15market.online
      - key: VITE_ARC_CONTRACT_ADDRESS
        value: "0x153cA7FAeE348f1892D1478868E15e17dDd09584"
      - key: VITE_TREASURY_ADDRESS
        value: "0x153cA7FAeE348f1892D1478868E15e17dDd09584"
      - key: VITE_ARC_USDC_ADDRESS
        value: "0x0000000000000000000000000000000000000000"
      - key: VITE_REOWN_PROJECT_ID
        value: "4aebd2ef806c541b6aaf003da2930c58"
      - key: VITE_ARC_ROUNDS_CONTRACT_ADDRESS
        value: "0x02AE9D2a7CEca436E7B3A482772EfB74C4fE4721"
      - key: VITE_ARC_RPC_1
        value: "https://rpc.testnet.arc.io"
      - key: VITE_PRICE_FEED_URL
        value: "https://prices.15market.com"
      - key: VITE_PRIVY_APP_ID
        value: "cmisfdm6o00j9jr0d2tjntq58"
      
  # Admin Frontend Service (Static Site)
  - type: static
    name: 15market-admin
    env: static
    rootDir: 15market-admin
    buildCommand: npm install --legacy-peer-deps && npm run build
    publishDir: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_KEEPER_URL
        value: https://15market-backend.onrender.com
      - key: VITE_KEEPER_URL_ARC
        value: https://15market-backend.onrender.com
      - key: VITE_SUPABASE_URL
        value: https://cwzbdxvninfagfbaehre.supabase.co
      - key: VITE_SUPABASE_AUTH_URL
        value: https://cwzbdxvninfagfbaehre.supabase.co
      # Set this in the Render Dashboard — it is a public key but kept out of
      # source control. Render will prompt for its value on first deploy.
      - key: VITE_SUPABASE_ANON_KEY
        sync: false

