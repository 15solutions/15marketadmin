server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Admin-specific security
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json;

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: https://app.beta.getpara.com; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://*.15market.online https://api.15market.online https://hermes.pyth.network https://api.devnet.solana.com https://rpc.testnet.arc.io https://rpc.blockdaemon.testnet.arc.io https://rpc.drpc.testnet.arc.io https://rpc.quicknode.testnet.arc.io wss://rpc.testnet.arc.io wss://rpc.blockdaemon.testnet.arc.io wss://rpc.drpc.testnet.arc.io wss://rpc.quicknode.testnet.arc.io https://price.jup.ag https://app.beta.getpara.com https://pulse.walletconnect.org https://api.web3modal.org https://rpc.walletconnect.com wss://relay.walletconnect.com https://cca-lite.coinbase.com https://api.binance.com https://api.mexc.com https://11155111.rpc.thirdweb.com https://*.supabase.co wss://*.supabase.co;" always;
}
